<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piper TTS Playroom</title>
  <style>
    :root {
      color-scheme: light;
      font-family: sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

    td.text-cell {
      font-size: 16px;
      line-height: 1.55;
      min-width: 280px;
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .word-chip {
      width: auto;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #d0d0d0;
      background: #f7f7f7;
      color: #111;
      font-size: 15px;
      line-height: 1.2;
      cursor: pointer;
    }

    .word-chip:hover {
      background: #ececec;
    }

    .word-chip-time {
      font-size: 11px;
      color: #888;
      margin-left: 3px;
      display: none;
    }

    .show-timestamps .word-chip-time {
      display: inline;
    }
      background: #f5f5f5;
      color: #111;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
      min-height: 100vh;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    form {
      display: grid;
      gap: 12px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      border: 1px solid #c7c7c7;
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .checkbox-field input {
      width: auto;
      padding: 0;
      margin: 0;
    }

    button {
      cursor: pointer;
      background: #111;
      color: #fff;
      border-color: #111;
    }

    button[disabled] {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 20px;
      font-size: 14px;
    }

    .status[data-tone="error"] {
      color: #a40000;
    }

    .status[data-tone="warning"] {
      color: #7a5200;
    }

    .status[data-tone="success"] {
      color: #006300;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid #e3e3e3;
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #fafafa;
    }

    audio {
      width: 240px;
      max-width: 100%;
    }

    .empty-state {
      color: #666;
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <h1>Piper TTS Playroom</h1>
      <p>
        Generate audio against the current Piper API.
        <a href="/docs">Open API docs</a>
      </p>
      <form id="playroom-form">
        <label>
          Language
          <select id="language" name="language" disabled></select>
        </label>

        <label>
          Voice
          <select id="voice" name="voice" disabled></select>
        </label>

        <div class="field-grid">
          <label>
            speaker_id
            <input id="speaker_id" name="speaker_id" type="number" min="0" step="1">
          </label>

          <label>
            sentence_silence
            <input id="sentence_silence" name="sentence_silence" type="number" step="0.01">
          </label>

          <label>
            length_scale
            <input id="length_scale" name="length_scale" type="number" step="0.001">
          </label>

          <label>
            noise_scale
            <input id="noise_scale" name="noise_scale" type="number" step="0.001">
          </label>

          <label>
            noise_w_scale
            <input id="noise_w_scale" name="noise_w_scale" type="number" step="0.001">
          </label>

          <label>
            volume
            <input id="volume" name="volume" type="number" step="0.001">
          </label>
        </div>

        <label class="checkbox-field" for="normalize_audio">
          <input id="normalize_audio" name="normalize_audio" type="checkbox">
          normalize_audio
        </label>

        <label class="checkbox-field" for="include_alignments">
          <input id="include_alignments" name="include_alignments" type="checkbox">
          include_alignments
        </label>

        <label class="checkbox-field" for="show_timestamps">
          <input id="show_timestamps" name="show_timestamps" type="checkbox">
          show_timestamps (debug)
        </label>

        <label>
          Grammar (optional)
          <textarea
            id="grammar"
            name="grammar"
            placeholder="One phrase per line, e.g.&#10;Hello world&#10;This is phrase two"
          ></textarea>
        </label>

        <label>
          Text
          <textarea id="text" name="text" placeholder="Enter text to synthesize"></textarea>
        </label>

        <button id="submit-button" type="submit" disabled>Synthesize</button>
        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </section>

    <section class="panel">
      <h2>Generated Audio</h2>
      <table>
        <thead>
          <tr>
            <th>Created</th>
            <th>Language</th>
            <th>Voice</th>
            <th>Text</th>
            <th>Audio</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr class="empty-state-row">
            <td class="empty-state" colspan="5">No audio generated yet.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script id="playroom-config" type="application/json">__PLAYROOM_CONFIG__</script>
  <script>
__PLAYROOM_SCRIPT__
  </script>
</body>
</html>
